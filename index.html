<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Cards With API</title>
</head>
<body>
    <header class="min-h-[80px] h-full flex items-center justify-center px-6 py-8">
        <div class="max-w-[1440px] w-full px-10 h-full flex items-center justify-between border-1 py-4 rounded-full border-[#ddd] bg-[#f1f1f1] shadow-sm">
            <span class="font-['Poppins'] text-[20px]">
                World Cars 
            </span>
            <span class="w-12 h-12 flex bg-[#ddd] rounded-full border-1 border-[#0005] shadow-sm transition-color duration-300" id="status">
            </span>
        </div>
    </header>

    <main class="flex items-center justify-center py-2 flex-col px-6">
    <div class="flex items-center justify-between w-full max-w-[1440px] gap-[30px]" id="filterBox">
        <label class="input outline-none rounded-full bg-[#f1f1f1] shadow-sm">
        <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <g
            stroke-linejoin="round"
            stroke-linecap="round"
            stroke-width="2.5"
            fill="none"
            stroke="currentColor"
            >
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
            </g>
        </svg>
        <input type="text" class="grow" placeholder="Search" id="search" />
        </label>

        <select class="select rounded-full bg-[#f1f1f1] shadow-sm" id="filter">
        <option value="no" selected>Select Types: None</option>
        <option value="sedan">Sedan</option>
        <option value="suv">SUV</option>
        <option value="hatchback">Hatchback</option>
        </select>

    </div>
    <div class="flex items-center justify-center h-[70vh] w-full max-w-[1440px]" id="loader">
    <span class="loading loading-ring loading-xl scale-[4]"></span>
    </div>
    <div class="flex items-center justify-start w-full max-w-[1440px] flex-wrap gap-[30px] py-10" id="cardsBox" >
    </div>
    <div class="hidden items-center justify-center h-[70vh] w-full max-w-[1440px] flex-col" id="errorBox">
        <h2 class="text-[60px] flex justify-center gap-[14px] items-center font-bold" id="scTitle">
            <span class="opacity-[0.75]">4</span>
            <i class="fas fa-robot"></i>
            <span class="w-[40px] h-[72px] relative flex justify-center items-center">
                <span class="absolute rotate-[180deg] ml-[-8px] opacity-[0.75]">4</span>
            </span>
        </h2>
        <span class="text-[18px] font-bold opacity-[0.75]">
           Opps... Something wrong
        </span>
    </div>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
